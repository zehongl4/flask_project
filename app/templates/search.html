<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Blog Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='blog.css') }}">
    <!-- Add font awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Navigation Bar -->
        <nav class="main-nav">
            <div class="nav-buttons">
                <a href="{{ url_for('blog.search') }}" class="nav-button search-button">
                    <i class="fas fa-search"></i> Search
                </a>
                {% if current_user.is_authenticated %}
                <a href="{{ url_for('blog.user_profile', username=current_user.username) }}" class="nav-button account-button">
                    <i class="fas fa-user"></i> My Account
                </a>
                {% else %}
                <a href="{{ url_for('auth.session_form', next=request.url) }}" class="nav-button login-button">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
                {% endif %}
            </div>
        </nav>
        
        
        <!-- Search Form for Blog Posts -->
        <div class="search-container">
            <form action="{{ url_for('blog.list_posts', username=username) }}" method="GET">
                <input type="text" name="search" placeholder="Search blog posts by title..." class="search-input">
                <button type="submit" class="search-button">Search</button>
            </form>
        </div>
        
        <main class="content-area">
            <!-- Section to display the user's blog posts -->
            <section class="blog-posts">
                <h2>Results</h2>
                <ul>
                    {% for post in posts %}
                    <li>
                        <!-- Show only the title of each post -->
                        <a href="{{ url_for('blog.view_post', post_id=post.id) }}">
                            <h3>{{ post.title }}</h3>
                        </a>
                        <small>Posted on {{ post.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
                    </li>
                    {% else %}
                    <li>No posts yet.</li>
                    {% endfor %}
                </ul>
            </section>
        </main>
    </div>
</body>
</html>
