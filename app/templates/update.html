<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Edit: {{ post.title }}</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='blog.css') }}">
   <meta name="csrf-token" content="{{ csrf_token() }}">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
   <div class="container">
       <!-- Navigation Bar -->
       <nav class="main-nav">
           <div class="nav-buttons">
               <a href="{{ url_for('blog.search') }}" class="nav-button search-button">
                   <i class="fas fa-search"></i> Search
               </a>
               <a href="{{ url_for('blog.user_profile', username=current_user.username) }}" class="nav-button account-button">
                   <i class="fas fa-user"></i> My Account
               </a>
           </div>
       </nav>

       <header>
           <h1 class="post-title">Edit Blog Post</h1>
       </header>

       <main class="content-area">
           <!-- Edit form using traditional submission -->
           <form action="{{ url_for('blog.update_post', post_id=post.id) }}" method="POST" class="edit-form">
               <!-- CSRF Token -->
               <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
               
               <!-- Title input -->
               <div>
                   <label for="title">Title</label>
                   <input type="text" id="title" name="title" value="{{ post.title }}" required class="edit-input">
               </div>
               
               <!-- Content textarea -->
               <div>
                   <label for="content">Content</label>
                   <textarea id="content" name="content" required class="edit-textarea">{{ post.content }}</textarea>
               </div>
               
               <!-- Post options -->
               <div style="margin-bottom: 20px;">
                   <label style="margin-right: 15px; display: inline-block;">
                       <input type="checkbox" id="is_draft" name="is_draft" onchange="toggleVisibility()" 
                              {% if post.is_draft %}checked{% endif %}> 
                       Save as draft
                   </label>
                   
                   <label id="visibilityOption" style="display: inline-block; {% if post.is_draft %}display:none{% endif %}">
                       <input type="checkbox" id="is_public" name="is_public" 
                              {% if post.is_public %}checked{% endif %}> 
                       Make public
                   </label>
               </div>

               <!-- Form buttons -->
               <div>
                   <button type="submit" class="save-button">Save Changes</button>
                   <a href="{{ url_for('blog.view_post', post_id=post.id) }}" class="cancel-button" style="display: inline-block; text-decoration: none; text-align: center;">Cancel</a>
               </div>
           </form>
       </main>
   </div>

   <script>
       function toggleVisibility() {
           var isDraft = document.getElementById('is_draft').checked;
           var visibilityOption = document.getElementById('visibilityOption');
           if (isDraft) {
               visibilityOption.style.display = 'none';
               document.getElementById('is_public').checked = false;
           } else {
               visibilityOption.style.display = 'inline-block';
           }
       }
   </script>
</body>
</html>
