<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Change Password Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="login">
        <img class="pix" src="https://cdn.worldvectorlogo.com/logos/smile.svg" alt="Smile Logo" />
        <h1>Change Password</h1>
        {% for message in get_flashed_messages() %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
        <form action="{{ url_for('auth.update_password') }}" method="POST">
            {{ form.hidden_tag() }}  <!-- This adds the CSRF token -->

            <p>Password</p>
            <input class="pas-text" type="password" name="new_password" placeholder="Enter Password" value="{{ form.new_password.data if form.new_password.data else '' }}" />
            {% for error in form.new_password.errors %}
                <span style="color: red;">{{ error }}</span>
            {% endfor %}

            <p>Confirm Password</p>
            <input class="pas-text" type="password" name="confirm" placeholder="Confirm Password" value="{{ form.confirm.data if form.confirm.data else '' }}"/>
            {% for error in form.confirm.errors %}
                <span style="color: red;">{{ error }}</span>
            {% endfor %}

            <input class="sub-text" type="submit" value="Change Password" />
        </form>
    </div>
</body>
</html>
